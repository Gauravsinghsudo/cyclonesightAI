<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="arm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="arm2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Cyclone Spiral Vortex Arms -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Arm 1 -->
    <path d="M 0 -45 
             C 45 -45, 95 -10, 110 40 
             C 125 90, 90 145, 30 160 
             C -20 172, -80 150, -115 110 
             C -130 92, -120 75, -100 85 
             C -60 115, 0 125, 45 100 
             C 85 75, 90 35, 65 0 
             C 45 -28, 15 -35, 0 -35 Z" 
          fill="url(#arm1)" filter="url(#glow)" opacity="0.95" />

    <!-- Arm 2 (Rotated 180 deg) -->
    <g transform="rotate(180)">
      <path d="M 0 -45 
               C 45 -45, 95 -10, 110 40 
               C 125 90, 90 145, 30 160 
               C -20 172, -80 150, -115 110 
               C -130 92, -120 75, -100 85 
               C -60 115, 0 125, 45 100 
               C 85 75, 90 35, 65 0 
               C 45 -28, 15 -35, 0 -35 Z" 
            fill="url(#arm2)" filter="url(#glow)" opacity="0.95" />
    </g>

    <!-- Inner Spiral Swirl -->
    <path d="M 0 -15 C 20 -15, 35 -5, 35 15 C 35 35, 15 45, -5 45 C -25 45, -40 25, -35 5 C -30 -10, -15 -12, 0 -15 Z"
          fill="none" stroke="url(#eyeGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Cyclone Eye -->
    <circle cx="0" cy="0" r="16" fill="#0b1120" stroke="#38bdf8" stroke-width="4" />
    <circle cx="0" cy="0" r="6" fill="#67e8f9" />
  </g>
</svg>
